
name: Build TorrentSearch APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: torrentsearch-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug"

          if [ ! -d "$APK_PATH" ]; then
            echo "APK output directory not found: $APK_PATH"
            exit 1
          fi

          mkdir -p dist

          find "$APK_PATH" -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} dist/ \;

          if ! find dist -maxdepth 1 -type f -name "*.apk" \
            | grep -q .; then
            echo "Build succeeded but no APK was found."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="build-${GITHUB_RUN_NUMBER}"
          fi

          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue
            mv "$apk" "dist/torrentsearch-${VERSION}.apk"
          done

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

          echo "Prepared files:"
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrentSearch-APK-${{ github.ref_name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TorrentSearch ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
